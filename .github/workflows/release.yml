# Publishes to npm and the MCP Registry when a version tag (v1.2.3) is pushed, or when run by hand
# from the Actions tab (Release > Run workflow), which finishes a release whose npm step already ran.
# No secrets: npm uses trusted publishing and the MCP Registry uses GitHub OIDC.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check versions match
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          srv="$(node -p "require('./server.json').version")"
          srvpkg="$(node -p "require('./server.json').packages[0].version")"
          if [ "$pkg" != "$srv" ] || [ "$pkg" != "$srvpkg" ]; then
            echo "package.json $pkg and server.json $srv / $srvpkg must match" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$pkg" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json $pkg" >&2
            exit 1
          fi
          echo "VERSION=$pkg" >> "$GITHUB_ENV"
          echo "PACKAGE=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"
          echo "MCP_NAME=$(node -p "require('./package.json').mcpName")" >> "$GITHUB_ENV"

      - run: npm test

      - name: Publish to npm (trusted publishing)
        run: |
          if npm view "$PACKAGE@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already on npm, skipping"
          else
            npm publish --access public
          fi

      - name: Wait until npm serves the new version
        run: |
          for i in $(seq 1 40); do
            if [ "$(npm view "$PACKAGE@$VERSION" mcpName --prefer-online 2>/dev/null)" = "$MCP_NAME" ]; then
              echo "$PACKAGE@$VERSION is available"; exit 0
            fi
            echo "Waiting for npm to finish processing $VERSION ($i/40)"; sleep 15
          done
          echo "npm still isn't serving $PACKAGE@$VERSION" >&2; exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: |
          for i in 1 2 3; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "Registry publish failed (attempt $i/3), retrying in 60s"; sleep 60
          done
          exit 1
